name: Yemen Study — Playwright end-to-end

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yemen-study-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Chromium desktop and mobile journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the production site
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Save Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yemen-study-playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
